# Cloudflare Pages settings for Framed: the built site, the API function's
# bindings and public settings, and the database migrations. Only
# placeholders for ids; secrets (BETTER_AUTH_SECRET, RESEND_API_KEY) are
# encrypted settings on the Pages project, never in this file (README).
name = "framed"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
# Better Auth uses AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://framed.my.id"
EMAIL_FROM = "Framed <login@framed.my.id>"
# Signing up needs an invite (`npm run invite`); "open" would let anyone sign up.
SIGN_UP_MODE = "invite"

[[d1_databases]]
binding = "DB"
database_name = "frameddatabase"
database_id = "c57218ea-d56f-4325-8baf-93ded646ebe2"
migrations_dir = "migrations"

# Picture and PDF storage is off for now (Arthur, 2026-11-09: R2 skipped
# while another option is chosen). Without this binding Framed runs with
# uploads switched off (server/storage.ts). To turn them on with R2, create
# the bucket and put these three lines back without the "#":
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "framed-images"
