# Cloudflare Pages settings for Framed: the built site, the API function's
# bindings and public settings, and the database migrations. Ids aren't
# secret; secrets (BETTER_AUTH_SECRET, RESEND_API_KEY) are encrypted
# settings on the Pages project, never in this file.
name = "framed"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
# Better Auth uses AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://framed.my.id"
EMAIL_FROM = "Framed <login@framed.my.id>"
# Signing up needs an invite (`npm run invite`); "open" would let anyone sign up.
SIGN_UP_MODE = "invite"

[[d1_databases]]
binding = "DB"
database_name = "frameddatabase"
database_id = "c57218ea-d56f-4325-8baf-93ded646ebe2"
migrations_dir = "migrations"

# Without an R2 binding named IMAGES, Framed runs with picture and PDF
# uploads switched off (server/storage.ts). To turn them on, create a private
# bucket and add:
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "<your bucket>"
